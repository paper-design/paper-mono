# Strictly monospaced build for terminals (isFixedPitch, single advance width).
# The source is generated from PaperMono.glyphspackage by
# scripts/make-term-source.py; run `make build` rather than building this directly.
sources:
  - PaperMonoTerm.glyphs
familyName: "Paper Mono Term"
outputDir: "../fonts/"
ttDir: "../fonts/terminal"
buildStatic: true
buildOTF: false
buildVariable: false
autohintOTF: true
buildWebfont: false
stat:
  PaperMonoTerm[wght].ttf:
  - name: Weight
    tag: wght
    values:
    - name: Thin
      value: 100
    - name: ExtraLight
      value: 200
    - name: Light
      value: 300
    - name: Regular
      value: 400
      linkedValue: 700
      flags: 2
    - name: Medium
      value: 500
    - name: SemiBold
      value: 600
    - name: Bold
      value: 700
    - name: ExtraBold
      value: 800
  - name: Italic
    tag: ital
    values:
    - name: Roman
      value: 0
      linkedValue: 1
      flags: 2
